[project]
name = "coppice"
version = "0.1.0"
description = "Path-based CLI for git worktrees, built on top of worktrunk (wt)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Luis Aceituno", email = "aceitunosoriano@gmail.com" }]
keywords = ["git", "worktree", "worktrunk", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = ["typer>=0.12", "rich>=13"]

[project.urls]
Repository = "https://github.com/luiul/coppice"
Issues = "https://github.com/luiul/coppice/issues"

[project.scripts]
coppice = "coppice.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coppice"]

[dependency-groups]
dev = ["ruff>=0.6", "ty", "pytest>=8"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ty.src]
include = ["src/coppice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
